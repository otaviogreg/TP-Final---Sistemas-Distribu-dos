server:
  port: ${CHAT_SERVICE_PORT:8082}

spring:
  application:
    name: chat-service
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5433/chat_db}
    username: ${CHAT_DB_USERNAME:postgres}
    password: ${CHAT_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:tp-chat-auth}
    secret-base64: ${AUTH_JWT_SECRET_BASE64}
  redis:
    channel: ${CHAT_REDIS_CHANNEL:chat:events}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}