services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../services/auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the root .env file}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-tp-chat-auth}
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?Set AUTH_JWT_SECRET_BASE64 in the root .env file}
      AUTH_JWT_EXPIRATION_SECONDS: ${AUTH_JWT_EXPIRATION_SECONDS:-3600}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  chat-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: ${CHAT_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-service:
    build:
      context: ../services/chat-service
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHAT_DB_URL: jdbc:postgresql://chat-db:5432/chat_db
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:-postgres}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in the root .env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-tp-chat-auth}
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?Set AUTH_JWT_SECRET_BASE64 in the root .env file}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:8081
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  auth-db-data:
  chat-db-data: